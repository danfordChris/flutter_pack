name: flutter_pack
description: A Flutter utility package that provides database helpers, model/repository generators, string/date extensions, and shared preferences management to speed up app development.
version: 1.0.9+1
homepage: https://github.com/danfordChris/flutter_pack.git
repository: https://github.com/danfordChris/flutter_pack.git

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"  

# Add regular dependencies here. 
dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
